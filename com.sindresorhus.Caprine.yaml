app-id: com.sindresorhus.Caprine
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '26.08'

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

separate-locales: false
command: caprine
finish-args:
  # Wayland with X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Required to provide Call functionality
  - --socket=pulseaudio
  - --device=all
  # Network access
  - --share=network
  # Local filesystem
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro

  # Required for notifications in various desktop environments
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Electron 38+ draws the tray icon with Chromium's own StatusNotifierItem,
  # which must own org.freedesktop.StatusNotifierItem-<pid>-<id>. The browser
  # process is always PID 2 inside the sandbox. Without this the icon can't be
  # registered and the main window never appears.
  - --own-name=org.freedesktop.StatusNotifierItem-2-1

# Enable node extension by adding it to path
build-options:
  append-path: /usr/lib/sdk/node22/bin

modules:
  # Build and install caprine
  - name: caprine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/caprine/flatpak-node/cache
        npm_config_cache: /run/build/caprine/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_offline: 'true'
    build-commands:
      - npm install --offline
      - ./node_modules/.bin/tsc
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        ./node_modules/.bin/electron-builder $ELECTRON_BUILDER_ARCH_ARGS --linux --dir
      - cp -a dist/linux*unpacked /app/main
      - install -Dm644 ../${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 ../${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm755 ../caprine.sh /app/bin/caprine
    subdir: main
    sources:
      - type: git
        url: https://github.com/bankjaneo/caprine
        tag: v2.62.0
        commit: 51c3b5b2d9099b0899feb483a0ae5130f9fd3990
        dest: main
      - type: patch
        path: caprine-tray-dedupe.patch
        dest: main
      - type: script
        dest-filename: caprine.sh
        commands:
          - set -o errexit
          - TMPDIR="${XDG_RUNTIME_DIR}/app/${FLATPAK_ID}"
          - export TMPDIR
          - exec zypak-wrapper.sh /app/main/caprine --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform-hint=auto "$@"
      - type: file
        path: com.sindresorhus.Caprine.desktop
      - type: file
        path: com.sindresorhus.Caprine.metainfo.xml
      - generated-sources.json
